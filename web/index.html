<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentloop</title>
<style>
  :root {
    --bg: #0a1512; --panel: #12211d; --border: #24413a;
    --text: #eef8f5; --muted: #8fb3aa; --accent: #4dd6c1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  header { width: 100%; max-width: 820px; padding: 28px 20px 8px; }
  h1 { font-size: 22px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  main { width: 100%; max-width: 820px; padding: 16px 20px 130px; flex: 1; }
  .msg { padding: 12px 14px; border-radius: 10px; margin: 10px 0; line-height: 1.5; white-space: pre-wrap; }
  .q { background: #1c332d; margin-left: 15%; }
  .a { background: var(--panel); border: 1px solid var(--border); margin-right: 15%; }
  .trace { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .trace summary { cursor: pointer; color: var(--accent); }
  .ev { border-left: 2px solid var(--border); padding: 4px 10px; margin: 5px 0; font-family: "SF Mono", Consolas, monospace; }
  .ev b { color: var(--accent); }
  form.ask {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 820px; padding: 12px 20px 20px;
    background: var(--bg);
  }
  .row { display: flex; gap: 10px; }
  .row input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px; color: var(--text); font-size: 15px;
  }
  .row input[type=text]:focus { outline: 2px solid var(--accent); }
  button {
    background: var(--accent); color: #06281f; font-weight: 700; border: 0;
    border-radius: 8px; padding: 9px 20px; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  label.approve { display: flex; gap: 7px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 9px; }
  label.approve input { accent-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>agent<span>loop</span></h1>
  <p class="sub">Tool-calling agent with guardrails. Tools: calculator, read_file, write_file (approval-gated). Every run is fully logged.</p>
</header>
<main><div id="chat"></div></main>
<form class="ask" id="askform">
  <div class="row">
    <input type="text" id="task" placeholder='Try: "What is (17 * 43) + 12? Save the answer to result.txt"' autocomplete="off">
    <button id="go">Run</button>
  </div>
  <label class="approve">
    <input type="checkbox" id="auto">
    Auto-approve write actions (unchecked = agent's writes are denied)
  </label>
</form>
<script>
const $ = id => document.getElementById(id);
$('askform').onsubmit = async (ev) => {
  ev.preventDefault();
  const task = $('task').value.trim();
  if (!task) return;
  $('task').value = '';
  add('q', task);
  const wait = add('a', 'Agent running...');
  $('go').disabled = true;
  try {
    const r = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, auto_approve: $('auto').checked }),
    });
    const j = await r.json();
    if (!r.ok) { wait.textContent = 'Error: ' + (j.detail || r.status); }
    else {
      wait.textContent = j.answer;
      if (j.events && j.events.length) {
        const d = document.createElement('details');
        d.className = 'trace';
        d.innerHTML = '<summary>run log (' + j.events.length + ' events)</summary>' +
          j.events.map(e => `<div class="ev"><b>${esc(e.event)}</b> ${esc(e.tool || '')} ${esc(e.result || e.reason || e.content || '')}</div>`).join('');
        wait.appendChild(d);
      }
    }
  } catch (e) { wait.textContent = 'Error: ' + e; }
  $('go').disabled = false;
};
function add(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  $('chat').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
  return div;
}
function esc(s) { const d = document.createElement('span'); d.textContent = String(s ?? ''); return d.innerHTML; }
</script>
</body>
</html>
